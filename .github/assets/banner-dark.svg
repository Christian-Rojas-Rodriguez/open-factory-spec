<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 220" preserveAspectRatio="xMidYMid meet" role="img" aria-label="open/factory — AN AGENT FACTORY FOR SPEC-DRIVEN SOFTWARE"
  style="display:block;width:100%;height:auto;">
  <defs>
    <radialGradient id="ofs-glow-dark" cx="0%" cy="50%" r="70%" fx="0%" fy="50%">
      <stop offset="0%"   stop-color="#f25050" stop-opacity="0.55"/>
      <stop offset="35%"  stop-color="#f25050" stop-opacity="0.30"/>
      <stop offset="70%"  stop-color="#f25050" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#f25050" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="220" fill="#0d0d0d"/>

  <!-- strawberry glow from the left edge -->
  <rect width="1280" height="220" fill="url(#ofs-glow-dark)"/>

  <!-- logo (cursive F→S monoline) — right-anchored, drawn in strawberry -->
  <g transform="translate(1144, 32)">
    <svg width="56" height="56" viewBox="0 0 64 64">
      <path d="M22 56 L22 18 C22 10 30 6 36 10 C42 14 40 22 32 22 L18 22 C12 22 12 30 18 30 L40 30 C48 30 50 38 44 42 C40 45 34 44 30 40"
        stroke="#f25050" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
  </g>

  <!-- wordmark -->
  <text x="1200" y="130" text-anchor="end"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="36" font-weight="600"
        letter-spacing="1.5" fill="#f5f3ee">open<tspan fill="rgba(245,243,238,0.4)">/</tspan>factory</text>

  <!-- tagline -->
  <text x="1200" y="162" text-anchor="end"
        font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="400"
        letter-spacing="2.5" fill="rgba(245,243,238,0.55)">AN AGENT FACTORY FOR SPEC-DRIVEN SOFTWARE</text>
</svg>
