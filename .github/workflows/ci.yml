name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # Full suite. The test harness runs the .ts test files via Node's native type
  # stripping (--experimental-strip-types), which requires Node ≥ 22.
  test:
    runs-on: ubuntu-latest
    name: build + test (node 22)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test

  # Minimum supported engine: the *published* artifact is compiled JS, so it must
  # build and run on Node 20 even though the dev test harness needs 22.
  build-min:
    runs-on: ubuntu-latest
    name: build + smoke (node 20, min engine)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Smoke-test the compiled CLI
        run: |
          node packages/cli/dist/index.js --version
          node packages/cli/dist/index.js --help >/dev/null
